<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; form-action 'none'; base-uri 'none'"><title>ALIX BACKUP 2.0 – isolierter Prototyp</title>
<style>
:root{--background:#111315;--surface:#1b1e21;--text:#f0f2f3;--muted:#a9adb1;--border:#363a3e;--accent:#d5ba70;--warning:#efbe66;--error:#f18a89;--success:#83c7a5}*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--text);font:15px/1.6 system-ui,sans-serif;letter-spacing:0}header,main{max-width:1220px;margin:auto;padding:28px}header{border-bottom:1px solid var(--border)}.brand{color:var(--accent);font-weight:700}.tag{color:var(--warning)}h1{font-size:30px;margin:8px 0}h2{font-size:21px;margin:0 0 20px}p{color:var(--muted)}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}button{font:inherit;border:1px solid var(--border);background:transparent;color:var(--text);padding:9px 14px;border-radius:6px;cursor:pointer}button[aria-selected=true]{background:var(--accent);color:var(--background);border-color:var(--accent)}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:24px 0}.metric{border:1px solid var(--border);border-radius:6px;padding:18px;background:var(--surface)}.metric strong{display:block;font-size:25px;color:var(--warning)}.metric small{color:var(--muted)}.table{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:13px 12px;border-bottom:1px solid var(--border)}th{color:var(--muted);font-size:13px}.warning{color:var(--warning)}.error{color:var(--error)}.ok{color:var(--success)}footer{border-top:1px solid var(--border);margin-top:32px;padding-top:16px;color:var(--muted)}@media(max-width:700px){header,main{padding:20px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:26px}}
.metric strong{overflow-wrap:anywhere}
</style></head><body><header><span class="brand">ALIX WORK / BACKUP CONTROL CENTER</span><h1>ALIX BACKUP 2.0</h1><div class="tag">Phase 9B · Isolierter Prototyp · Nur synthetische Daten</div><nav role="tablist" aria-label="Backup-Bereiche"></nav></header><main><section id="content" role="tabpanel" aria-live="polite"></section><footer>Keine produktive Verbindung. Keine Sicherung, Wiederherstellung, Löschung oder Benachrichtigung ausführbar.<br>Diese Beispielansicht ist kein Sicherungsnachweis.</footer></main>
<script>
const tabs=['Übersicht','Datenbanken','Storage','Hetzner','Wiederherstellung','Sicherheit'];
const metrics=(entries)=>'<div class="metrics">'+entries.map(([label,value,note])=>'<div class="metric">'+label+'<strong>'+value+'</strong><small>'+note+'</small></div>').join('')+'</div>';
const table=(head,rows)=>'<div class="table"><table><thead><tr>'+head.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
function show(i){document.querySelectorAll('[role=tab]').forEach((b,j)=>{b.setAttribute('aria-selected',j===i?'true':'false');b.tabIndex=j===i?0:-1});const c=document.getElementById('content');c.setAttribute('aria-labelledby','tab-'+i);
let body='';
if(i===0)body=metrics([['Letzter Lauf','Unvollständig','synthetischer Lauf DEMO-003'],['Objekte verifiziert','29 / 31','keine produktiven Objekte'],['Integrität','Offen','2 Objekte ohne Readback'],['Wiederherstellung','Nicht getestet','kein Restore ausgeführt']])+table(['Lauf','Umfang','Transfer','Verifikation','Restore'],[['DEMO-003','31 Beispielobjekte','31 hochgeladen','<span class="warning">29 bestätigt / 2 offen</span>','Nicht getestet'],['DEMO-002','31 Beispielobjekte','<span class="error">Zielausfall</span>','Nicht vollständig','Nicht getestet'],['DEMO-001','31 Beispielobjekte','31 hochgeladen','<span class="ok">Synthetisch geprüft</span>','Nicht getestet']]);
if(i===1)body=metrics([['Entdeckt','942','synthetische Tabellen'],['Erfasst','272','synthetisches Altmodell'],['Fehlend','670','noch nicht gesichert'],['PITR','Unbekannt','Provider nicht verbunden']])+table(['Bereich','Abdeckung','Status'],[['public','272 / 942','<span class="warning">Unvollständig</span>'],['auth','Nicht geprüft','Kein Providerbeleg'],['storage','Nur Metadatenmodell','Keine Originalbytes'],['DDL / Rollen / Funktionen','Geplant','Kein Restorebeleg']]);
if(i===2)body=metrics([['Buckets','31','synthetische Buckets'],['Befüllt','18','Beispieldaten'],['Leer','13','Konfiguration erforderlich'],['Zielinventur','Offen','kein echtes Ziel']])+table(['Bucket','Objekte','Verifiziert','Versionen','Status'],Array.from({length:31},(_,j)=>['demo-bucket-'+String(j+1).padStart(2,'0'),j<18?'10':'0',j<18?'8 / 10':'0 / 0','Nicht geprüft',j<18?'<span class="warning">Unvollständig</span>':'Konfiguration geplant']));
if(i===3)body=table(['Prüfung','Status','Nachweis'],[['Erreichbarkeit','<span class="warning">Nicht geprüft</span>','Kein Netzwerkadapter'],['Letzter bestätigter Upload','Unbekannt','Kein produktiver Lauf'],['Zielbestand / Speicher','Unbekannt','Keine vollständige Inventur'],['Versionierung','Geplant','Aktivierung nicht nachgewiesen'],['Object Lock','Geplant','Neues Ziel benötigt Freigabe'],['Verschlüsselung','Geplant','Kein KMS-/AEAD-Test'],['Fehlerprotokoll','DEMO: Zielausfall','Synthetisches Beispiel']]);
if(i===4)body=table(['Plan','Ziel','Freigabe','Ausführung'],[['DEMO-RESTORE-001','Isoliertes Beispielziel','Zweite Person erforderlich','<span class="warning">Gesperrt in Phase 9B</span>'],['Sicherungspunkt','DEMO-001','Nur synthetisch','Keine Wiederherstellung'],['Frühere Testprotokolle','Keine','Nicht geprüft','Kein Abnahmenachweis']]);
if(i===5)body=table(['Kontrolle','Vorgabe','Status'],[['Rollen','Backup / Audit / Restore getrennt','Nur Planungsmodell'],['MFA / JIT','Pflicht bei privilegiertem Zugriff','Nicht angeschlossen'],['Vier Augen','Antragsteller ≠ Approver','Synthetisch geprüft'],['Audit','Signatur + externer Rootanker','Geplant'],['Retention','Datenklassen + Legal Hold','Rechtliche Freigabe offen'],['Löschschutz','Keine Löschaktion','Phase 9B gesperrt']]);
c.innerHTML='<h2>'+tabs[i]+'</h2>'+body;}
const nav=document.querySelector('nav');tabs.forEach((name,i)=>{const b=document.createElement('button');b.id='tab-'+i;b.setAttribute('role','tab');b.textContent=name;b.addEventListener('click',()=>show(i));b.addEventListener('keydown',e=>{if(['ArrowRight','ArrowLeft','Home','End'].includes(e.key)){e.preventDefault();const n=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;show(n);document.getElementById('tab-'+n).focus()}});nav.appendChild(b)});show(0);
</script></body></html>
